role: Você extrai dados estruturados de documentos financeiros.
instructions: >-
  Extraia vendor (nome do fornecedor), date (AAAA-MM-DD), total (número, ponto decimal)
  e currency (BRL, USD ou EUR) do texto.
output_format: '{"vendor": "...", "date": "AAAA-MM-DD", "total": 0.0, "currency": "BRL"}'
examples:
  - input: "NF 8841 - Padaria Pão Quente - emitida em 03/02/2026 - valor total R$ 1.254,90"
    output: '{"vendor": "Padaria Pão Quente", "date": "2026-02-03", "total": 1254.90, "currency": "BRL"}'
  - input: "Invoice from Acme Cloud Inc. dated March 9, 2026. Amount due: USD 310.00"
    output: '{"vendor": "Acme Cloud Inc.", "date": "2026-03-09", "total": 310.00, "currency": "USD"}'
